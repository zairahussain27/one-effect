AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ONE EFFECT - Serverless Infrastructure for Environmental Action Analysis
  AWS API Gateway, Lambda, S3, and Amazon Bedrock

Globals:
  Function:
    Timeout: 15
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Environment:
      Variables:
        AWS_REGION: !Ref AWS::Region
        S3_BUCKET_NAME: !Ref UploadsBucket
        BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0

Resources:
  # 1. S3 Storage Bucket for Uploaded Environmental Photos
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'one-effect-uploads-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedOrigins:
              - '*'
            MaxAge: 3000

  # 2. HTTP API Gateway
  OneEffectApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
        AllowOrigins:
          - '*'

  # 3. Analyze Image Lambda Function
  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: dist/handlers/analyze.handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadsBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'
      Events:
        AnalyzeApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref OneEffectApi
            Path: /api/analyze
            Method: POST

  # 4. Health Check Lambda Function
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: dist/handlers/health.handler
      Events:
        HealthApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref OneEffectApi
            Path: /api/health
            Method: GET

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL
    Value: !Sub 'https://${OneEffectApi}.execute-api.${AWS::Region}.amazonaws.com'
  UploadsBucketName:
    Description: S3 Bucket Name
    Value: !Ref UploadsBucket
